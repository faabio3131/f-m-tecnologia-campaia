name: CAMPAIA Frontend Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  test:
    name: Lint, typecheck, contract/security boundaries, unit+component tests, build, E2E smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Typecheck (strict)
        working-directory: web
        run: npm run typecheck

      - name: Contract drift check (bff-openapi.yaml vs. generated types)
        working-directory: web
        run: npm run contracts:check

      - name: WP-01 security boundary check
        working-directory: web
        run: npm run boundary:check

      - name: Unit, component and accessibility tests
        working-directory: web
        run: npm run test

      - name: Production build
        working-directory: web
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: E2E smoke (desktop + mobile viewport)
        working-directory: web
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
