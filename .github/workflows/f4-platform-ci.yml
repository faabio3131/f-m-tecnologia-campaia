name: CAMPAIA F4 Platform CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        run: terraform fmt -check -recursive infra

      - name: Validate infrastructure shell scripts
        run: |
          bash -n infra/scripts/bootstrap-terraform-backend.sh
          bash -n infra/scripts/staging-runtime.sh

      - name: Validate low-cost staging network invariants
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'google_vpc_access_connector' infra/terraform/main.tf; then
            echo "Serverless VPC Access connector must not return to the F4 foundation." >&2
            exit 1
          fi
          if grep -q 'vpcaccess.googleapis.com' infra/terraform/main.tf; then
            echo "vpcaccess API is not needed with Direct VPC egress." >&2
            exit 1
          fi
          if grep -q -- '--vpc-connector=' .github/workflows/cloud-run-release.yml; then
            echo "Release workflow must use Direct VPC egress." >&2
            exit 1
          fi
          grep -q -- '--network=' .github/workflows/cloud-run-release.yml
          grep -q -- '--subnet=' .github/workflows/cloud-run-release.yml
          grep -q 'default     = "10.8.0.0/26"' infra/terraform/variables.tf

      - name: Validate bootstrap stack
        run: |
          terraform -chdir=infra/bootstrap init -backend=false
          terraform -chdir=infra/bootstrap validate

      - name: Validate environment foundation
        run: |
          terraform -chdir=infra/terraform init -backend=false
          terraform -chdir=infra/terraform validate

  containers:
    name: Reproducible container builds and boot smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --pull -t campaia-backend-ci backend

      - name: Smoke restricted image worker in production container
        run: |
          docker run --rm campaia-backend-ci python3 -c "import io; from PIL import Image; from campaia_core.asset_images import normalize_asset_image; image = io.BytesIO(); Image.new('RGB', (2, 3), 'red').save(image, format='PNG'); result = normalize_asset_image(image.getvalue()); assert (result.width, result.height) == (2, 3)"

      - name: Smoke migration module entrypoint
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm campaia-backend-ci python3 -m scripts.migrate_postgres --help >/dev/null

      - name: Boot and smoke backend production image
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name campaia-backend-ci-run \
            -p 18080:8080 \
            -e CAMPAIA_ENV=test \
            campaia-backend-ci
          trap 'docker logs campaia-backend-ci-run || true; docker rm -f campaia-backend-ci-run >/dev/null 2>&1 || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:18080/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Backend container did not become live." >&2
          exit 1

      - name: Build web image
        run: |
          docker build --pull \
            --build-arg CAMPAIA_BFF_ORIGIN=https://backend.invalid \
            --build-arg NEXT_PUBLIC_GOOGLE_IDENTITY_CLIENT_ID=ci-client.invalid \
            --build-arg NEXT_PUBLIC_IDENTITY_PLATFORM_PUBLIC_API=ci-public-api.invalid \
            --build-arg NEXT_PUBLIC_CAMPAIA_IDENTITY_MODE=test \
            -t campaia-web-ci web

      - name: Boot and smoke web production image
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name campaia-web-ci-run -p 18081:8080 campaia-web-ci
          trap 'docker logs campaia-web-ci-run || true; docker rm -f campaia-web-ci-run >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --location http://127.0.0.1:18081/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Web container did not become reachable." >&2
          exit 1

  security:
    name: Secret scan and SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Secret scan
        run: python3 infra/scripts/scan-secrets.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit==1.9.4

      - name: Bandit high-severity SAST
        run: bandit -r backend/api backend/campaia_core -lll -q
