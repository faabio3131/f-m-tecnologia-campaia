name: TEMP security lock refresh

on:
  push:
    branches: ["fix/frontend-security-audit-20261014"]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/frontend-security-audit-20261014
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refresh lockfile from governed overrides
        working-directory: web
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify clean install
        working-directory: web
        run: npm ci

      - name: Verify governed dependency audit
        working-directory: web
        run: npm run audit:ci

      - name: Commit generated lockfile and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/security-lock-refresh.yml
          git add web/package-lock.json
          git diff --cached --check
          git commit -m "fix(web): refresh lockfile for security patches"
          git push origin HEAD:fix/frontend-security-audit-20261014
