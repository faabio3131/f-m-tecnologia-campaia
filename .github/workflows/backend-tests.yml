name: CAMPAIA Backend Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  test:
    name: Run unit + API test suites
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Dependency vulnerability audit (pip-audit)
        working-directory: backend
        run: |
          pip install pip-audit
          # Fase D (27/09/2026, auditoria independente): gate real de CI, nao so
          # documentacao local. Falha o build se houver vulnerabilidade conhecida nas
          # dependencias de producao -- ver docs/evidence para justificativa caso uma
          # excecao pontual precise ser registrada no futuro (nenhuma hoje).
          python3 -m pip_audit -r requirements.txt

      - name: Run core unit tests (backend/tests)
        working-directory: backend
        run: python3 -m unittest discover -s tests -v

      - name: Run API tests (backend/tests_api)
        working-directory: backend
        run: python3 -m unittest discover -s tests_api -t . -v

      - name: Install contracts dependencies
        working-directory: contracts
        run: pip install -r requirements.txt

      - name: Validate AsyncAPI contract
        working-directory: contracts
        run: python3 validate_events_asyncapi.py
