openapi: 3.1.0
info:
  title: CAMPAIA — Web BFF API
  version: 1.0.0-draft
  description: |
    Contrato entre a aplicacao Web CAMPAIA e o backend. Evolui de forma aditiva conforme os Gates.

    Invariantes que este contrato materializa:
      1. `tenant_id` NUNCA vem do cliente. E derivado do token de autenticacao. Nenhum endpoint
         aceita tenant_id no corpo ou na query.
      2. Nenhum endpoint devolve segredo, token de provedor ou credencial, em nenhuma circunstancia.
      3. Toda operacao com efeito externo exige o header `Idempotency-Key`.
      4. Operacoes sensiveis exigem `X-Step-Up-Token` (reautenticacao recente).
      5. Publicar, alterar verba e mudar autonomia exigem uma aprovacao humana ja registrada.
         O BFF nao aprova nada: ele encaminha decisao tomada por humano identificado.
      6. Estado externo devolvido e sempre o ultimo estado reconciliado, com `last_synced_at`.
         O produto nunca afirma publicacao sem ID externo confirmado.
  contact:
    name: CAMPAIA — Engenharia
servers:
  - url: https://api.campaia.app/v1
    description: Producao (NAO PROVISIONADO — exige autorizacao do Diretor)
  - url: https://api.staging.campaia.app/v1
    description: Homologacao (NAO PROVISIONADO)

security:
  - bearerAuth: []

tags:
  - name: Conta
  - name: Sessao
  - name: Marca
  - name: Conexoes
  - name: Campanhas
  - name: Governanca
  - name: Metricas
  - name: Billing

paths:
  /auth/session:
    post:
      tags: [Sessao]
      summary: Login real via Google Identity Platform -- troca id_token por sessao server-side
      description: |
        Autoridade de identidade e sempre o backend: verifica o `id_token` do provedor,
        resolve tenant/unidade/papeis pelo diretorio interno (nunca por claim do provedor,
        nunca autoprovisiona). Em caso de sucesso, cria uma sessao server-side e devolve o
        cookie de sessao `campaia_session` (HttpOnly; Secure; SameSite=Lax) -- nunca o
        id_token bruto do Google. Nao exige `security` previa (nao ha sessao ainda);
        protegido contra login-CSRF por validacao de Origin/Referer no servidor.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token]
              properties:
                id_token: { type: string }
      responses:
        '200':
          description: OK -- cookie de sessao setado via Set-Cookie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Identidade provada, mas sem vinculo com nenhum tenant do CampaIA (fail-closed, nunca autoprovisiona)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      tags: [Sessao]
      summary: Recupera a sessao ativa e um novo csrf_token (apos reload, sem novo login)
      operationId: getSession
      security: [cookieAuth: []]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Sessao]
      summary: Logout -- invalida a sessao server-side e limpa o cookie
      description: |
        Sempre devolve 204, mesmo sem sessao ativa ou com sessao ja invalida/expirada --
        nunca falha o logout do lado do cliente por um estado de sessao que ja nao importa.
      operationId: logout
      security: [cookieAuth: []]
      responses:
        '204': { description: Sessao invalidada (ou ja nao havia nenhuma) }

  /auth/session/switch:
    post:
      tags: [Sessao]
      summary: Troca o vinculo (tenant/unidade) ATIVO da sessao para outro vinculo real da mesma identidade
      description: |
        So aceita um `user_id` presente entre os vinculos capturados no login desta mesma
        identidade (nunca um tenant/vinculo arbitrario de outra identidade -- validado
        fail-closed pelo backend). Mesma sessao/cookie/csrf_secret depois da troca; invalida
        implicitamente `step_up_at` (chave `(tenant_id, user_id)`), exigindo nova
        reautenticacao para operacoes sensiveis no vinculo novo.
      operationId: switchMembership
      security: [cookieAuth: []]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: string, description: user_id de um dos vinculos devolvidos por GET /me/memberships }
      responses:
        '200':
          description: OK -- vinculo ativo trocado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: CSRF ausente/invalido, ou o vinculo solicitado nao pertence a esta identidade
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /me:
    get:
      tags: [Conta]
      summary: Perfil, tenant, unidade e permissoes efetivas do usuario autenticado
      operationId: getMe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/memberships:
    get:
      tags: [Conta, Sessao]
      summary: Lista os vinculos (tenant/unidade/papeis) reais da sessao atual, marcando o ativo
      description: |
        Exige sessao real (cookie) -- o fixture de bearer token de dev/teste nao tem conceito
        de vinculos multiplos e e recusado aqui (401). Vinculos vem exclusivamente do login
        desta identidade, nunca de outra.
      operationId: listMemberships
      security: [cookieAuth: []]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MembershipsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /onboarding/tenant:
    post:
      tags: [Conta, Sessao]
      summary: Cria explicitamente um novo tenant comercial para uma identidade verificada
      description: |
        Nao e login e nunca e autoprovisionamento por e-mail. O backend verifica o id_token,
        normaliza/valida a empresa, cria o tenant + unidade Principal + primeiro Owner como
        um unico agregado no runtime atual e emite sessao server-side. Documento/CNPJ, quando
        informado, e unico entre tenants; duplicata exige recuperacao/reativacao, nao novo tenant.
      operationId: createCommercialTenant
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantOnboardingRequest' }
      responses:
        '201':
          description: Tenant criado e sessao emitida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantOnboardingResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Origem/identidade nao autorizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Documento ja associado a outro tenant ou estado incompativel
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /onboarding/invitations/accept:
    post:
      tags: [Conta, Sessao]
      summary: Aceita convite vinculando identidade verificada ao tenant/unidade convidados
      operationId: acceptCommercialInvitation
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationAcceptRequest' }
      responses:
        '200':
          description: Convite aceito e sessao emitida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantOnboardingResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Identidade nao corresponde ao e-mail do convite
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Convite invalido, expirado ou ja utilizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /memberships:
    get:
      tags: [Conta]
      summary: Lista usuarios/vinculos do tenant atual para Owner/Admin
      operationId: listCommercialMembers
      security: [cookieAuth: []]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CommercialMembership' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Usuario sem MEMBER_VIEW
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /member-invitations:
    get:
      tags: [Conta]
      summary: Lista convites do tenant atual
      operationId: listMemberInvitations
      security: [cookieAuth: []]
      parameters:
        - $ref: '#/components/parameters/StepUpToken'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MemberInvitation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StepUpRequired' }
    post:
      tags: [Conta]
      summary: Cria convite de usuario no tenant/unidade atuais
      description: |
        Owner/Admin podem convidar. Admin nao pode criar Owner. O token bruto de aceite e
        devolvido somente nesta primeira criacao; o servidor persiste apenas seu hash.
      operationId: createMemberInvitation
      security: [cookieAuth: []]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/StepUpToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationCreateRequest' }
      responses:
        '201':
          description: Convite criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberInvitation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StepUpRequired' }
        '409':
          description: Usuario ja ativo ou convite pendente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Limite de usuarios do plano atingido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /memberships/{membershipId}/deactivate:
    post:
      tags: [Conta]
      summary: Desativa acesso sem apagar historico e revoga sessoes associadas
      operationId: deactivateCommercialMember
      security: [cookieAuth: []]
      parameters:
        - name: membershipId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/StepUpToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Usuario desativado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommercialMembership' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StepUpRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Auto-desativacao/ultimo Owner ou estado invalido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /memberships/{membershipId}/reactivate:
    post:
      tags: [Conta]
      summary: Reativa o mesmo vinculo preservando identidade e historico
      operationId: reactivateCommercialMember
      security: [cookieAuth: []]
      parameters:
        - name: membershipId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/StepUpToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Usuario reativado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommercialMembership' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StepUpRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429':
          description: Limite de usuarios do plano atingido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /memberships/{membershipId}:
    patch:
      tags: [Conta]
      summary: Atualiza papeis e unidade de um vinculo ativo do tenant atual
      description: |
        Owner/Admin podem alterar papeis e unidade. Somente Owner pode administrar ou
        conceder OWNER. O ultimo Owner ativo nao pode perder OWNER. Mudanca de autoridade
        revoga imediatamente as sessoes do vinculo alterado; tenant_id nunca vem do cliente.
      operationId: updateCommercialMemberAccess
      security: [cookieAuth: []]
      parameters:
        - name: membershipId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/StepUpToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MembershipAccessUpdateRequest' }
      responses:
        '200':
          description: Acesso atualizado e sessoes antigas do vinculo revogadas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommercialMembership' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StepUpRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Ultimo Owner ativo nao pode perder OWNER
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /business-units:
    get:
      tags: [Conta]
      summary: Lista unidades de negocio do tenant atual
      operationId: listBusinessUnits
      security: [cookieAuth: []]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BusinessUnit' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Usuario sem MEMBER_VIEW
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      tags: [Conta]
      summary: Cria unidade de negocio no tenant atual
      operationId: createBusinessUnit
      security: [cookieAuth: []]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/StepUpToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BusinessUnitCreateRequest' }
      responses:
        '201':
          description: Unidade criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusinessUnit' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StepUpRequired' }
        '409':
          description: Ja existe uma unidade com este nome
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /business-units/{businessUnitId}:
    patch:
      tags: [Conta]
      summary: Renomeia unidade de negocio do tenant atual
      operationId: renameBusinessUnit
      security: [cookieAuth: []]
      parameters:
        - name: businessUnitId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/StepUpToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BusinessUnitRenameRequest' }
      responses:
        '200':
          description: Unidade renomeada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusinessUnit' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StepUpRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Ja existe uma unidade com este nome
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /business-units/{businessUnitId}/deactivate:
    post:
      tags: [Conta]
      summary: Desativa unidade vazia preservando historico
      operationId: deactivateBusinessUnit
      security: [cookieAuth: []]
      parameters:
        - name: businessUnitId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/StepUpToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Unidade desativada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusinessUnit' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StepUpRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Unidade possui membros ativos ou e a ultima unidade ativa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /business-units/{businessUnitId}/reactivate:
    post:
      tags: [Conta]
      summary: Reativa unidade preservando identidade e historico
      operationId: reactivateBusinessUnit
      security: [cookieAuth: []]
      parameters:
        - name: businessUnitId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/StepUpToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Unidade reativada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusinessUnit' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StepUpRequired' }
        '404': { $ref: '#/components/responses/NotFound' }

  /brand-profiles:
    get:
      tags: [Marca]
      summary: Lista Brand Kits do tenant
      operationId: listBrandProfiles
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BrandProfile' }
    post:
      tags: [Marca]
      summary: Cria Brand Kit
      operationId: createBrandProfile
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BrandProfileInput' }
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrandProfile' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /connections:
    get:
      tags: [Conexoes]
      summary: Contas externas conectadas
      description: Nunca retorna token, refresh token ou qualquer segredo.
      operationId: listConnections
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Connection' }

  /connections/oauth/start:
    post:
      tags: [Conexoes]
      summary: Inicia fluxo OAuth para um provedor
      description: |
        Devolve a URL de autorizacao oficial do provedor. O app apenas abre essa URL.
        O callback e recebido pelo backend; o token nunca transita pelo aplicativo.
      operationId: startOAuth
      parameters:
        - $ref: '#/components/parameters/StepUpToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider]
              properties:
                provider: { $ref: '#/components/schemas/Provider' }
      responses:
        '200':
          description: URL de autorizacao
          content:
            application/json:
              schema:
                type: object
                required: [authorization_url, state]
                properties:
                  authorization_url: { type: string, format: uri }
                  state: { type: string }
        '403': { $ref: '#/components/responses/StepUpRequired' }

  /connections/oauth/callback:
    post:
      tags: [Conexoes]
      summary: Resgata o `state` do fluxo OAuth e cria a Connection (WP-04, 26/09/2026)
      description: |
        `state` de uso unico, amarrado ao tenant que chamou startOAuth -- nunca aceito
        de outro tenant nem reutilizavel apos o primeiro resgate (sucesso ou falha).
        `external_account_id`/`display_name` representam a conta selecionada pelo
        usuario no provedor (simulado nesta etapa; nenhum provider real e contatado).

        SEGURANCA (27/09/2026, achado 4 de auditoria independente): este endpoint
        NUNCA aceita um token real do provedor no corpo da requisicao -- o TARGET
        comercial e' a troca de OAuth ser inteiramente server-side (usuario -> Google/
        Meta -> authorization code -> este callback -> backend troca o code por
        tokens diretamente com o provedor -> grava no Credential Vault), sem o
        refresh/access token do tenant jamais trafegar pelo browser. Essa troca real
        ainda depende de um Client OAuth "Aplicativo da Web" com dominio de callback
        publicado, que nao existe ainda (EXTERNAL_INFRASTRUCTURE, ver ADR-0013).
      operationId: oauthCallback
      parameters:
        - $ref: '#/components/parameters/StepUpToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state, external_account_id, display_name]
              properties:
                state: { type: string }
                external_account_id: { type: string }
                display_name: { type: string }
      responses:
        '201':
          description: Connection criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Connection' }
        '403':
          description: state invalido, expirado, ja usado, de outro tenant, ou reautenticacao ausente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /connections/{connectionId}:
    delete:
      tags: [Conexoes]
      summary: Revoga a conexao e o segredo associado
      operationId: revokeConnection
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
        - $ref: '#/components/parameters/StepUpToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204': { description: Revogada }
        '403': { $ref: '#/components/responses/StepUpRequired' }

  /connections/{connectionId}/capabilities:
    get:
      tags: [Conexoes]
      summary: Capacidades comprovadas para esta conta, pais e versao de API
      description: |
        Fonte da verdade para a interface. O app so oferece acao com `supported = true`.
        Capacidade sem `verified_at` recente e tratada como indisponivel.
      operationId: getCapabilities
      parameters:
        - $ref: '#/components/parameters/ConnectionId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Capability' }

  /briefs:
    post:
      tags: [Campanhas]
      summary: Submete briefing e cria campanha em DRAFT
      operationId: submitBrief
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: Conforme campaign-brief.schema.json, sem tenant_id (derivado do token).
        content:
          application/json:
            schema: { type: object }
      responses:
        '202':
          description: Aceito; geracao de estrategia em andamento
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /campaigns:
    get:
      tags: [Campanhas]
      summary: Lista campanhas do tenant
      operationId: listCampaigns
      parameters:
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/CampaignState' }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Campaign' }
                  next_cursor: { type: [string, 'null'] }

  /campaigns/{campaignId}:
    get:
      tags: [Campanhas]
      summary: Detalhe da campanha, com estado reconciliado
      operationId: getCampaign
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '404': { $ref: '#/components/responses/NotFound' }

  /campaigns/{campaignId}/plan:
    get:
      tags: [Campanhas]
      summary: Ultima versao do plano proposto
      description: Conforme campaign-plan.schema.json. Inclui proveniencia da IA e justificativa.
      operationId: getCampaignPlan
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object }

  /campaigns/{campaignId}/plan/quote:
    get:
      tags: [Campanhas]
      summary: Consulta debito da estrategia antes de confirmar, sem executar IA
      operationId: quoteStrategy
      security: [cookieAuth: []]
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Cotacao server-side ou medicao comercial legada nao ativada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StrategyCreditQuote' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Sem franquia ou acesso comercial para executar a operacao inteira
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /campaigns/{campaignId}/plan/regenerate:
    post:
      tags: [Campanhas]
      summary: Gera estrategia; contrato comercial exige debito revisado e confirmado
      operationId: regeneratePlan
      security: [cookieAuth: []]
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                credit_confirmation: { $ref: '#/components/schemas/CreditConfirmation' }
      responses:
        '202': { description: Geracao iniciada }
        '409': { $ref: '#/components/responses/InvalidState' }

  /campaigns/{campaignId}/validate:
    post:
      tags: [Campanhas]
      summary: Valida plano contra politica, orcamento e capacidades
      description: |
        Nao produz efeito externo. Emite `policy_decision_id` quando aprovavel.
        Este e o unico caminho para obter autorizacao de publicacao.
      operationId: validateCampaign
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Resultado da validacao
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyDecision' }
        '409': { $ref: '#/components/responses/InvalidState' }

  /campaigns/{campaignId}/publish:
    post:
      tags: [Campanhas]
      summary: Publica nas contas autorizadas
      description: |
        Exige `policy_decision_id` valido e nao expirado, aprovacao humana registrada e
        `Idempotency-Key`. Responde 202: publicacao e assincrona e so vira ACTIVE apos
        reconciliacao com ID externo confirmado por canal.
      operationId: publishCampaign
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/StepUpToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [policy_decision_id, approval_id]
              properties:
                policy_decision_id: { type: string, format: uuid }
                approval_id: { type: string, format: uuid }
      responses:
        '202':
          description: Publicacao iniciada (Saga aberta)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '403': { $ref: '#/components/responses/ApprovalRequired' }
        '409': { $ref: '#/components/responses/InvalidState' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /campaigns/{campaignId}/pause:
    post:
      tags: [Campanhas]
      summary: Pausa a campanha em todos os canais
      operationId: pauseCampaign
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202': { description: Pausa solicitada }

  /campaigns/{campaignId}/resume:
    post:
      tags: [Campanhas]
      summary: Retoma uma campanha pausada (PAUSED -> ACTIVE)
      description: |
        Fase 4, item A da missao de reconciliacao/takeover (26/09/2026): o dominio
        (campaia_core/states.py) ja tinha a transicao PAUSED -> ACTIVE modelada e
        testada (guarda `_guard_resume`, bloqueia se o kill switch estiver ativo) --
        so faltava exposicao via API. Exige o mesmo nivel de cautela que publicar
        (step-up), pois volta a gerar gasto externo real; NAO exige nova aprovacao
        humana porque a guarda de dominio para esta transicao especifica nao exige
        uma (diferente de APPROVED -> PUBLISHING, que exige `approval_id`).
      operationId: resumeCampaign
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/StepUpToken'
      responses:
        '202':
          description: Retomada solicitada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '409': { $ref: '#/components/responses/InvalidState' }

  /campaigns/{campaignId}/budget:
    patch:
      tags: [Governanca]
      summary: Altera orcamento
      description: |
        Aumento relevante exige aprovacao humana e step-up. Variacao percentual acima do
        limite configurado e recusada com 403, nao "ajustada automaticamente".
      operationId: updateBudget
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/StepUpToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [daily_cap, approval_id]
              properties:
                daily_cap: { type: number, exclusiveMinimum: 0 }
                total_amount: { type: number, exclusiveMinimum: 0 }
                approval_id: { type: string, format: uuid }
      responses:
        '202': { description: Alteracao aceita }
        '403': { $ref: '#/components/responses/ApprovalRequired' }

  /approvals:
    get:
      tags: [Governanca]
      summary: Aprovacoes pendentes do usuario
      operationId: listApprovals
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ApprovalRequest' }
    post:
      tags: [Governanca]
      summary: Cria um pedido de aprovacao pendente para uma campanha (WP-05, 26/09/2026)
      description: |
        Nao documentado anteriormente (achado, ver api/routes_approvals.py::create_approval):
        os fluxos gated por aprovacao (publicar, mudar verba, mudar autonomia) exigem uma
        ApprovalRequest ja registrada, mas nenhum endpoint a criava no contrato -- sem isto,
        POST /approvals/{id}/decision nao tinha nada para decidir. Este e' um criador
        minimo: nao produz nenhum efeito de dominio por si so.
      operationId: createApproval
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [campaign_id, kind]
              properties:
                campaign_id: { type: string }
                kind: { type: string, enum: [PUBLISH, BUDGET_CHANGE, AUTONOMY_CHANGE] }
                amount: { type: [string, 'null'] }
                requires_dual_approval: { type: boolean, default: false }
      responses:
        '201':
          description: Pedido de aprovacao criado (PENDING)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /approvals/{approvalId}/decision:
    post:
      tags: [Governanca]
      summary: Aprova, rejeita ou pede ajuste
      description: |
        Registra ator, momento, versao do plano e justificativa na trilha imutavel.
        Aprovacao dupla, quando exigida pela politica, so se completa com dois atores distintos.
      operationId: decideApproval
      parameters:
        - name: approvalId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/StepUpToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [APPROVE, REJECT, REQUEST_CHANGES] }
                reason: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: Decisao registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequest' }
        '403': { $ref: '#/components/responses/StepUpRequired' }
        '409':
          description: Decisao ja registrada ou aprovador nao elegivel

  /autonomy:
    get:
      tags: [Governanca]
      summary: Nivel de autonomia vigente e limites
      operationId: getAutonomy
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutonomySettings' }
    put:
      tags: [Governanca]
      summary: Altera nivel de autonomia
      description: Sempre exige aprovacao humana e step-up, em qualquer nivel atual.
      operationId: setAutonomy
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/StepUpToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [level, approval_id]
              properties:
                level: { type: integer, minimum: 0, maximum: 3 }
                approval_id: { type: string, format: uuid }
      responses:
        '200':
          description: Alterado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutonomySettings' }
        '403': { $ref: '#/components/responses/ApprovalRequired' }

  /kill-switch:
    post:
      tags: [Governanca]
      summary: Aciona parada de emergencia
      description: |
        Escopos: CAMPAIGN, ACCOUNT, TENANT, PLATFORM, GLOBAL.
        E o unico caminho que dispensa fila normal de decisao, porque so REDUZ efeito.
        Nunca pode ampliar efeito. Ainda assim gera evento e auditoria.
        `scope=GLOBAL` e' fail-closed (403 PERMISSION_DENIED) para qualquer chamador
        comum de tenant (27/09/2026, correcao de seguranca Fase C1): nenhuma autoridade
        de PLATFORM_ADMIN existe ainda neste sistema, e o valor anterior permitia que um
        tenant qualquer pausasse campanhas de outros tenants so por ter KILL_SWITCH no
        proprio escopo. Reservado para quando essa autoridade existir de verdade.
      operationId: activateKillSwitch
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, reason]
              properties:
                scope: { type: string, enum: [CAMPAIGN, ACCOUNT, TENANT, PLATFORM, GLOBAL] }
                target_id: { type: [string, 'null'], format: uuid }
                reason: { type: string, maxLength: 500 }
      responses:
        '202':
          description: Acionado; pausa propagando
          content:
            application/json:
              # Achado da reconciliacao WP-08 (26/09/2026): o corpo real de
              # `POST /kill-switch` (backend/api/routes_campaigns.py::kill_switch) sempre
              # devolve este formato -- confirmado por execucao real
              # (`tests_api/test_smoke_endpoints.py::test_kill_switch_tenant_scope`
              # ja asserta `affected_campaign_ids`), mas o contrato nunca declarava um
              # schema de resposta -- aditivo, sem mudanca de comportamento do backend.
              schema:
                type: object
                properties:
                  scope: { type: string, enum: [CAMPAIGN, ACCOUNT, TENANT, PLATFORM, GLOBAL] }
                  affected_campaign_ids:
                    type: array
                    items: { type: string, format: uuid }


  /billing/plans:
    get:
      tags: [Billing]
      summary: Lista somente os planos do catalogo comercial configurado
      operationId: listBillingPlans
      security: [cookieAuth: []]
      responses:
        '200':
          description: Catalogo configurado; valores decimais preservados como strings
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/BillingPlan' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Usuario sem BILLING_VIEW
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Catalogo ausente ou invalido; nenhum plano padrao e utilizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /billing/usage:
    get:
      tags: [Billing]
      summary: Consulta franquia e reservas persistidas do ciclo do tenant
      operationId: getBillingUsage
      security: [cookieAuth: []]
      responses:
        '200':
          description: Medicao autoritativa ou indisponibilidade explicita, nunca saldo presumido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingUsage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Sem permissao BILLING_VIEW
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }

  /billing/usage/consent:
    post:
      tags: [Billing]
      summary: OWNER ou FINANCE autoriza ou revoga teto de excedente com step-up
      operationId: setBillingCreditConsent
      security: [cookieAuth: []]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/StepUpToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BillingCreditConsent' }
      responses:
        '200':
          description: Consentimento auditado; preco e versao conferidos pelo servidor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingUsage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StepUpRequired' }
        '409':
          description: Ciclo, versao ou preco mudou; trial ou ausencia de ciclo pago
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /billing/subscription:
    get:
      tags: [Billing]
      summary: Consulta assinatura, trial, plano e entitlements do tenant atual
      operationId: getBillingSubscription
      security: [cookieAuth: []]
      responses:
        '200':
          description: Assinatura atual
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingSubscription' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Usuario sem BILLING_VIEW
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Billing]
      summary: Configura assinatura inicial ou inicia trial segundo o catalogo comercial
      description: |
        Nunca ativa assinatura paga apenas por selecao do browser. O plano vem do catalogo
        server-side; start_trial apenas solicita o trial cuja duracao pertence ao catalogo.
        Troca de plano usa exclusivamente /billing/subscription/change-plan.
      operationId: putBillingSubscription
      security: [cookieAuth: []]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/StepUpToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BillingSubscriptionUpsert' }
      responses:
        '200':
          description: Assinatura configurada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingSubscription' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StepUpRequired' }
        '409':
          description: Troca de plano exige fluxo explicito; criacao inicial duplicada ou condicoes alteradas sao recusadas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503':
          description: Catalogo comercial indisponivel
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /billing/subscription/change-plan:
    post:
      tags: [Billing]
      summary: Solicita upgrade ou downgrade permitido pelo catalogo
      description: |
        O plano atual permanece autoritativo ate liquidacao de cobranca correspondente
        ao plano-alvo e ao proposito PLAN_CHANGE. Regras de transicao e cobranca sao
        configuracao comercial externa, nunca hardcode por tenant.
      operationId: changeBillingPlan
      security: [cookieAuth: []]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/StepUpToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BillingPlanChangeRequest' }
      responses:
        '200':
          description: Troca registrada como pendente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingSubscription' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StepUpRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Transicao nao permitida ou assinatura em estado incompativel
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Catalogo comercial indisponivel
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /billing/subscription/undo-plan:
    post:
      tags: [Billing]
      summary: Desiste da troca agendada antes do fechamento financeiro
      operationId: undoBillingPlanChange
      security: [cookieAuth: []]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/StepUpToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Agendamento removido; plano atual preservado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingSubscription' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StepUpRequired' }
        '409':
          description: Obrigacao ja fechada ou paga; exige conciliacao
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /billing/subscription/cancel:
    post:
      tags: [Billing]
      summary: Cancela assinatura conforme politica explicita do catalogo
      operationId: cancelBillingSubscription
      security: [cookieAuth: []]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/StepUpToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                immediate: { type: boolean, default: false }
      responses:
        '200':
          description: Assinatura cancelada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingSubscription' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StepUpRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Politica de cancelamento ausente ou incompativel
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }


  /billing/subscription/reactivate:
    post:
      tags: [Billing]
      summary: Solicita reativacao com novo pagamento obrigatorio
      description: |
        Reativacao volta a PENDING_PAYMENT. Entitlement nao e restaurado ate liquidacao
        de cobranca com proposito REACTIVATION correspondente ao plano vigente.
      operationId: reactivateBillingSubscription
      security: [cookieAuth: []]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/StepUpToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Reativacao solicitada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingSubscription' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StepUpRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Assinatura ou politica incompativel
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /billing/closure:
    get:
      tags: [Billing]
      summary: Consulta o excedente final do lifecycle encerrado
      operationId: getBillingClosure
      security: [cookieAuth: []]
      responses:
        '200':
          description: Consumo entregue, mínimo validado e situação financeira, sem nova mensalidade
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingClosure' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Billing]
      summary: Confirma fechamento final sem conceder outro ciclo
      operationId: closeBillingUsage
      security: [cookieAuth: []]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/StepUpToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [fingerprint, accept]
              properties:
                fingerprint: { type: string, pattern: '^[a-f0-9]{64}$' }
                accept: { type: boolean }
      responses:
        '200':
          description: Fechamento sem cobrança, residual absorvido ou invoice final registrado; não confirma pagamento
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingClosure' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StepUpRequired' }
        '409':
          description: Revisão ou conciliação pendente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Emissão incerta, sem segundo POST automático
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /billing/notices:
    get:
      tags: [Billing]
      summary: Lista avisos internos de cobrança e leitura individual
      operationId: listBillingNotices
      security: [cookieAuth: []]
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Avisos disponíveis no aplicativo; não confirma envio externo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingNotices' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Usuario sem BILLING_VIEW
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /billing/notices/{noticeId}/read:
    post:
      tags: [Billing]
      summary: Marca aviso como lido pelo usuário autenticado
      operationId: readBillingNotice
      security: [cookieAuth: []]
      parameters:
        - name: noticeId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Leitura individual registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingNoticeRead' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Usuario sem BILLING_VIEW
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Contexto da chave alterado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /billing/renewal:
    get:
      tags: [Billing]
      summary: Consulta autorização de emissão recorrente
      operationId: getBillingRenewal
      security: [cookieAuth: []]
      responses:
        '200':
          description: Condições da emissão recorrente; não autoriza débito
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingRenewal' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Sem BILLING_VIEW
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    put:
      tags: [Billing]
      summary: Altera autorização explícita de emissão recorrente
      operationId: setBillingRenewal
      security: [cookieAuth: []]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/StepUpToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [fingerprint, enabled]
              properties:
                fingerprint: { type: string, pattern: '^[a-f0-9]{64}$' }
                enabled: { type: boolean }
      responses:
        '200':
          description: Autorização registrada; nenhuma fatura foi emitida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingRenewal' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StepUpRequired' }
        '409':
          description: Condições ou autorização pendente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /billing/guarantee:
    get:
      tags: [Billing]
      summary: Consulta a garantia comercial do primeiro pagamento verificado
      operationId: getBillingGuarantee
      security: [cookieAuth: []]
      responses:
        '200':
          description: Janela comercial e pagamentos considerados; não confirma devolução
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingGuarantee' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Sem BILLING_VIEW
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Billing]
      summary: Registra pedido de garantia e encerra explicitamente o acesso pago
      operationId: requestBillingGuarantee
      security: [cookieAuth: []]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/StepUpToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [fingerprint, accept]
              properties:
                fingerprint: { type: string, pattern: '^[a-f0-9]{64}$' }
                accept: { type: boolean }
      responses:
        '200':
          description: Pedido recebido; nenhum estorno foi enviado ou confirmado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingGuarantee' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StepUpRequired' }
        '409':
          description: Janela ou revisão pendente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /billing/checkout:
    get:
      tags: [Billing]
      summary: Revisa a obrigação comercial autoritativa sem emitir cobrança
      description: Sem consulta ao gateway nem freeze financeiro; titular minimizado e ambiente explícito.
      operationId: getBillingCheckout
      security: [cookieAuth: []]
      responses:
        '200':
          description: Cotação, cobrança já registrada ou indisponibilidade explícita
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingCheckout' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Sem BILLING_VIEW
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /billing/charges/{gatewayChargeId}/withdraw:
    post:
      tags: [Billing]
      summary: Retira renovação aberta após encerramento, sem estornar ou apagar histórico
      description: Fence durável permite apenas uma tentativa de exclusão; replay incerto consulta o provedor. Somente prova de exclusão de invoice não paga permite separar consumo final.
      operationId: withdrawBillingRenewal
      security: [cookieAuth: []]
      parameters:
        - name: gatewayChargeId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/StepUpToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [fingerprint, accept]
              properties:
                fingerprint: { type: string, pattern: '^[a-f0-9]{64}$' }
                accept: { type: boolean }
      responses:
        '200':
          description: Retirada confirmada; não representa pagamento ou devolução
          content:
            application/json:
              schema:
                type: object
                required: [state, billing_id, gateway_charge_id, amount, observed_at]
                properties:
                  state: { type: string, enum: [VOID] }
                  billing_id: { type: string }
                  gateway_charge_id: { type: string }
                  amount: { type: string }
                  provider: { type: string }
                  mode: { type: string }
                  observed_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StepUpRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: Retirada indisponível ou revisão/contexto alterado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Retirada incerta; não repetir exclusão automaticamente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /billing/charges/{gatewayChargeId}/reconcile:
    post:
      tags: [Billing]
      summary: Consulta recebimento no provedor e concilia sem emitir outra cobrança
      description: GET externo fora da transação; valor/status vêm apenas do provedor vinculado à obrigação do tenant.
      operationId: reconcileBillingPayment
      security: [cookieAuth: []]
      parameters:
        - name: gatewayChargeId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/StepUpToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200':
          description: Observação conferida ou pendente; não aceita comprovante/status fornecido pelo cliente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingWebhookReceipt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StepUpRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Contexto ou provedor/ambiente divergente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Consulta externa não confirmada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /billing/charges:
    get:
      tags: [Billing]
      summary: Historico de cobrancas do tenant com ultima observacao registrada
      description: |
        Sem chamadas ao gateway. Status e origem sao observacoes persistidas, nao consulta
        em tempo real; registros legados podem nao possuir essas informacoes. Nao retorna
        CPF/CNPJ, customer_ref nem credenciais. Pagina fixa de ate 50 cobrancas.
      operationId: listBillingCharges
      security: [cookieAuth: []]
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Historico isolado por tenant, inclusive sem assinatura atual
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingChargeHistory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Usuario sem BILLING_VIEW
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Billing]
      summary: Cria cobranca idempotente para uma competencia
      description: |
        A cobranca usa plano/proposito autoritativos do servidor. Retry com a mesma
        Idempotency-Key nao duplica efeito externo. Confirmacao chega pelo webhook.
      operationId: createBillingCharge
      security: [cookieAuth: []]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/StepUpToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BillingChargeCreate' }
      responses:
        '202':
          description: Cobranca criada ou reencontrada no gateway
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingCharge' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StepUpRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Cotação alterada ou contexto de conciliação divergente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Emissão incerta ou divergente, sem redispatch automático
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /webhooks/asaas:
    post:
      tags: [Billing]
      summary: Recebe evento de pagamento do Asaas
      description: |
        Endpoint provider-to-provider sem sessao de usuario. Autenticidade vem de
        asaas-access-token; dedupe e rate-limit sao server-side. Pagamento tardio pode
        ser liquidado financeiramente sem reativar entitlement indevido.
      operationId: receiveAsaasWebhook
      security: []
      parameters:
        - name: asaas-access-token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Evento aceito; processed indica se houve liquidacao aplicavel
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingWebhookReceipt' }
        '401':
          description: Token de webhook invalido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingWebhookReceipt' }
        '429':
          description: Rate limit por origem excedido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingWebhookReceipt' }

  /campaigns/{campaignId}/insights:
    get:
      tags: [Metricas]
      summary: Metricas reconciliadas da campanha
      operationId: getInsights
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InsightSeries' }

  /audit-events:
    get:
      tags: [Governanca]
      summary: Trilha de auditoria do tenant
      operationId: listAuditEvents
      parameters:
        - name: campaign_id
          in: query
          schema: { type: string, format: uuid }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AuditEvent' }
                  next_cursor: { type: [string, 'null'] }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de sessao. O `tenant_id` e derivado dele e nunca aceito do cliente.
    cookieAuth:
      type: apiKey
      in: cookie
      name: campaia_session
      description: |
        Sessao real Web (ADR-0018/WP-02) -- cookie HttpOnly/Secure/SameSite=Lax, opaco,
        emitido por POST /auth/session apos login real via Google Identity Platform. O
        `tenant_id` e derivado da sessao server-side, nunca aceito do cliente. Mutacoes sob
        este esquema exigem tambem o header X-CSRF-Token (ver parametro CsrfToken) --
        double-submit cookie, diferente do fluxo bearerAuth (mobile), que nao usa CSRF.

  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
      description: |
        Double-submit CSRF (sessao cookieAuth apenas). Valor devolvido em csrf_token pelo
        login/GET de sessao; comparado em tempo constante contra o segredo do lado do
        servidor. Ausente/invalido -> 403.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
      description: Repetir o mesmo valor NAO duplica o efeito; devolve o resultado original.
    StepUpToken:
      name: X-Step-Up-Token
      in: header
      required: true
      schema: { type: string }
      description: Prova de reautenticacao recente. Exigido em conexao de conta, verba, autonomia e aprovacao.
    CampaignId:
      name: campaignId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConnectionId:
      name: connectionId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Nao autenticado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Nao encontrado neste tenant
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Payload invalido segundo o schema canonico
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidState:
      description: Transicao de estado nao permitida pela maquina de estados
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    StepUpRequired:
      description: Reautenticacao necessaria
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ApprovalRequired:
      description: Aprovacao humana ausente, invalida ou expirada
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:

    BillingSubscriptionUpsert:
      type: object
      additionalProperties: false
      required: [plan_id, customer_document]
      properties:
        plan_id: { type: string }
        customer_document:
          type: string
          description: CPF/CNPJ exigido pelo contrato de cobranca; nunca inferido.
        initial_only:
          type: boolean
          default: false
          description: Quando true, recusa assinatura existente sem altera-la
        expected_plan_fingerprint:
          type: [string, 'null']
          pattern: '^[a-f0-9]{64}$'
          description: Versao das condicoes selecionadas; mudanca no catalogo exige nova confirmacao
        start_trial:
          type: boolean
          default: false

    BillingPlanChangeRequest:
      type: object
      additionalProperties: false
      required: [target_plan_id]
      properties:
        expected_plan_fingerprint: { type: [string, 'null'], pattern: '^[a-f0-9]{64}$' }
        target_plan_id: { type: string }

    BillingEntitlements:
      type: object
      required: [max_users, max_active_campaigns, channels, ai_capabilities, resources]
      properties:
        max_users: { type: [integer, 'null'], minimum: 1 }
        max_active_campaigns: { type: [integer, 'null'], minimum: 1 }
        channels: { type: array, items: { type: string } }
        ai_capabilities: { type: array, items: { type: string } }
        resources: { type: array, items: { type: string } }

    BillingPlan:
      type: object
      required: [fingerprint, plan_id, name, currency, monthly_price, included_credits,
                 extra_credit_unit_price, trial_days, cancellation_mode,
                 reactivation_mode, reactivation_billing_mode, plan_changes]
      properties:
        fingerprint: { type: string, pattern: '^[a-f0-9]{64}$' }
        plan_id: { type: string }
        name: { type: string }
        currency: { type: string, enum: [BRL] }
        monthly_price: { type: string }
        included_credits: { type: string }
        extra_credit_unit_price: { type: string }
        trial_days: { type: [integer, 'null'] }
        credit_policy:
          anyOf:
            - { $ref: '#/components/schemas/BillingCreditPolicy' }
            - { type: 'null' }
        cancellation_mode: { type: [string, 'null'] }
        reactivation_mode: { type: [string, 'null'] }
        reactivation_billing_mode: { type: [string, 'null'] }
        plan_changes:
          type: array
          items:
            type: object
            required: [target_plan_id, kind, billing_mode]
            properties:
              target_plan_id: { type: string }
              kind: { type: string }
              activation: { type: [string, 'null'] }
              billing_mode: { type: [string, 'null'] }

    BillingSubscription:
      type: object
      required:
        [tenant_id, customer_ref, customer_document, plan_id, plan_name, status,
         commercial_terms, entitlement_access_active]
      properties:
        payment_review_required: { type: boolean }
        commercial_terms:
          description: Snapshot contratado; nao substituido por alteracoes posteriores do catalogo
          $ref: '#/components/schemas/BillingPlan'
        tenant_id: { type: string }
        customer_ref: { type: string }
        customer_document: { type: string }
        plan_id: { type: string }
        plan_name: { type: string }
        status:
          type: string
          enum: [PENDING_PAYMENT, TRIAL, ACTIVE, PAST_DUE, EXPIRED, CANCELED]
        trial_started_at: { type: [string, 'null'], format: date-time }
        trial_ends_at: { type: [string, 'null'], format: date-time }
        activated_at: { type: [string, 'null'], format: date-time }
        pending_plan_id: { type: [string, 'null'] }
        pending_plan_name: { type: [string, 'null'] }
        pending_plan_change_kind: { type: [string, 'null'] }
        pending_plan_change_billing_mode: { type: [string, 'null'] }
        cancel_at_period_end: { type: [string, 'null'], format: date-time }
        pending_plan_effective_at: { type: [string, 'null'], format: date-time }
        paid_period_starts_at: { type: [string, 'null'], format: date-time }
        paid_period_ends_at: { type: [string, 'null'], format: date-time }
        pending_plan_entitlements:
          anyOf:
            - { $ref: '#/components/schemas/BillingEntitlements' }
            - { type: 'null' }
        canceled_at: { type: [string, 'null'], format: date-time }
        reactivation_requested_at: { type: [string, 'null'], format: date-time }
        past_due_at: { type: [string, 'null'], format: date-time }
        grace_period_ends_at: { type: [string, 'null'], format: date-time }
        past_due_in_grace: { type: boolean }
        past_due_access_mode:
          type: [string, 'null']
          enum: [ALLOW_DURING_GRACE, BLOCK_IMMEDIATELY, null]
        dunning_reminders_sent: { type: integer, minimum: 0 }
        next_dunning_reminder_at: { type: [string, 'null'], format: date-time }
        entitlement_access_active: { type: boolean }
        entitlements:
          anyOf:
            - { $ref: '#/components/schemas/BillingEntitlements' }
            - { type: 'null' }

    BillingChargeHistoryItem:
      type: object
      required: [billing_id, gateway_charge_id, competence, currency, amount, plan_id,
                 purpose, created_at, gateway_status, gateway_provider, gateway_mode,
                 status_observed_at, status_source, invoice_url]
      properties:
        billing_id: { type: string }
        gateway_charge_id: { type: string }
        competence: { type: string }
        currency: { type: string }
        amount: { type: string }
        plan_id: { type: [string, 'null'] }
        gateway_observed_amount: { type: [string, 'null'] }
        payment_reconciliation_state: { type: [string, 'null'] }
        gateway_chargeback_status: { type: [string, 'null'] }
        gateway_refund_amount: { type: [string, 'null'] }
        gateway_refund_state: { type: [string, 'null'] }
        gateway_refund_observed_at: { type: [string, 'null'], format: date-time }
        reconciliation_available: { type: boolean }
        withdrawal_state: { type: [string, 'null'], enum: [REQUESTED, VOID, REVIEW, null] }
        withdrawal_fingerprint: { type: [string, 'null'] }
        withdrawal_observed_at: { type: [string, 'null'], format: date-time }
        purpose: { type: string, enum: [REGULAR, PLAN_CHANGE, REACTIVATION, FINAL_USAGE] }
        created_at: { type: [string, 'null'], format: date-time }
        gateway_status: { type: [string, 'null'] }
        gateway_provider: { type: [string, 'null'] }
        gateway_mode: { type: [string, 'null'] }
        status_observed_at: { type: [string, 'null'], format: date-time }
        status_source: { type: [string, 'null'] }
        invoice_url:
          type: [string, 'null']
          description: Fatura hospedada retornada pelo Asaas, validada por ambiente; nunca sintetizada

