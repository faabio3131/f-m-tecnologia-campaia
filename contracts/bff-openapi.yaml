          type: object
          properties:
            currency: { type: string }
            # Achado (reconciliacao PR#6, 26/09/2026, confirmado por execucao real de
            # Decimal.model_dump_json() nesta sessao): estes 3 campos sao `Decimal` em
            # api/models.py e o pydantic v2 sempre serializa Decimal como STRING em
            # model_dump_json(), nunca como number. O contrato dizia `number` desde a
            # construcao original -- nunca era verdade em runtime. Corrigido para
            # refletir o CURRENT real, mesmo padrao ja usado em ApprovalRequest.amount.
