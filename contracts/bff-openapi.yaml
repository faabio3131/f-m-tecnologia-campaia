          type: array
          description: Vazio ate a reconciliacao confirmar. Estado ACTIVE exige ao menos um ID externo.
          items:
            type: object
            properties:
              channel: { $ref: '#/components/schemas/Channel' }
              external_resource_id: { type: string }
