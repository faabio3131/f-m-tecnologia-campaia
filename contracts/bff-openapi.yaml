        id: { type: string, format: uuid }
        campaign_id: { type: string, format: uuid }
        reason: { type: string, description: Gatilho que exigiu aprovacao humana. }
        # Campos reais sempre serializados pelo backend (api/models.py::ApprovalResponse)
        # que nunca tinham sido documentados aqui (achado, WP-05, 26/09/2026).
        kind: { type: string, enum: [PUBLISH, BUDGET_CHANGE, AUTONOMY_CHANGE] }
        requested_by: { type: string, description: user_id de quem propos -- nunca pode decidir a propria proposta (segregacao de funcoes). }
        amount: { type: [string, 'null'] }
        plan_version: { type: integer }
        # APPLIED adicionado na Fase 3 desta reconciliacao (achado 19): confirmado por
        # execucao real que uma ApprovalRequest APPROVED nunca era marcada como consumida
        # apos autorizar de fato uma mudanca (budget/autonomy) -- o mesmo approval_id
        # podia ser reutilizado indefinidamente com uma Idempotency-Key nova. APPLIED e
        # o novo estado terminal para "ja usada para aplicar a mudanca que autorizava".
        # Aditivo -- nenhum valor existente do enum foi removido ou renomeado.
        status: { type: string, enum: [PENDING, APPROVED, REJECTED, CHANGES_REQUESTED, EXPIRED, APPLIED] }
        requires_dual_approval: { type: boolean }
        decided_by: { type: array, items: { type: string, format: uuid } }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }

    AutonomySettings:
      type: object
      properties:
        level: { type: integer, minimum: 0, maximum: 3 }
        level_label: { type: string, enum: [ASSISTENTE, APROVADO, LIMITADO, OPERACIONAL] }
        # Achado da reconciliacao WP-07 (26/09/2026): GET /autonomy sempre devolve este
        # campo de fato (backend/api/models.py::AutonomyResponse, confirmado por execucao
        # real de model_dump_json()), mas o contrato nunca o declarava -- aditivo, sem
        # mudanca de comportamento do backend, mesma classe de achado do budget (WP-06).
        max_level_allowed: { type: integer, minimum: 0, maximum: 3 }
        always_require_human:
          type: array
          description: Gatilhos que exigem humano em QUALQUER nivel.
          items: { type: string }
        max_budget_change_pct: { type: number }
        updated_at: { type: string, format: date-time }

    InsightSeries:
      type: object
      properties:
        campaign_id: { type: string, format: uuid }
        last_synced_at: { type: [string, 'null'], format: date-time }
        # WP-11 (achado 15): InsightSeriesResponse.model_dump_json() real sempre inclui
        # `note` (o backend usa este campo para declarar honestamente, ao cliente, que
        # ainda nao ha camada de analytics real -- "No analytics layer implemented yet
        # in campaia_core; this is an honest placeholder, not fabricated data.") --
        # confirmado por execucao direta nesta sessao. Contrato nunca declarava este
        # campo -- aditivo, sem mudanca de comportamento do backend.
        note: { type: string }
        points:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              channel: { $ref: '#/components/schemas/Channel' }
              impressions: { type: integer }
              clicks: { type: integer }
              spend: { type: number }
              conversions: { type: integer }
              cpa: { type: [number, 'null'] }

    AuditEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        occurred_at: { type: string, format: date-time }
        actor_kind: { type: string, enum: [USER, SYSTEM, AI, EXTERNAL_PROVIDER] }
        actor_id: { type: [string, 'null'], format: uuid }
        action: { type: string }
        target: { type: string }
        policy_decision_id: { type: [string, 'null'], format: uuid }
        evidence: { type: [object, 'null'] }
